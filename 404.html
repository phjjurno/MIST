<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>창문을 찾을 수 없어요 — MIST : 비밀창문</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0F1419" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 32px; text-align: center;
           font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', sans-serif;
           color: #F4EEE2; background: radial-gradient(120% 90% at 50% 20%, #2A3440 0%, #0F1419 70%); }
    .code { font-size: 72px; font-weight: 800; letter-spacing: -0.04em; color: rgba(244,238,226,.85);
            text-shadow: 0 0 24px rgba(244,238,226,.25); filter: blur(.4px); }
    h1 { font-size: 20px; margin: 8px 0; }
    p { color: rgba(244,238,226,.65); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    a { display: inline-block; background: #1D9BF0; color: #fff; text-decoration: none;
        font-weight: 700; padding: 12px 24px; border-radius: 999px; }
    a:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>김이 너무 서려서 안 보여요</h1>
    <p>주소가 바뀌었거나 없어진 페이지예요.<br>비밀창문은 홈에서 다시 열 수 있어요.</p>
    <a href="/">비밀창문 열기</a>
  </main>
</body>
</html>
