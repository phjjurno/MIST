[build]
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── 캐시 정책 ─────────────────────────────────────────────────────────────
# 기본은 짧게 간다. 예전엔 "/*" 가 1년+immutable 이었는데, 루트 문서("/")는
# "/*.html" 규칙에 안 걸려서(경로가 /index.html 이 아니라 /) 페이지 자체가
# 1년간 브라우저에 얼어붙었다. 그래서 배포해도 반영이 안 됐다.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML 은 항상 재검증 (루트 경로 포함)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# js/css 는 index.html 에서 ?v=N 으로 버전을 붙여 부른다.
# 그래도 만료는 짧게 — v 를 깜빡했을 때 오래 얼어붙지 않도록.
[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/css/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# 이미지·아이콘은 내용이 바뀌면 파일명을 바꾸므로 길게 캐시해도 안전
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
